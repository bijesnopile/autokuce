# =============================================================================
# Predložak za jednog klijenta na zajedničkom VPS-u (kopira ga deploy/new-client.sh u
# clients/<ime>/). Samo app + db; promet dolazi preko zajedničkog Caddyja na mreži `web`.
# Nijedan port nije otvoren prema van. Vrijednosti su u clients/<ime>/.env.
# =============================================================================

services:
  # Jednokratno: vlasništvo nad ./data za korisnika `app` (uid 1000).
  init:
    image: ${AUTOKUCA_IMAGE:-autokuca:latest}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /app/data/media /app/data/outbox /app/data/backups
        && find /app/data -maxdepth 3 ! -user app -exec chown app:app {} +
    volumes:
      - ./data:/app/data
    restart: "no"
    network_mode: none

  app:
    image: ${AUTOKUCA_IMAGE:-autokuca:latest}
    container_name: ${CLIENT:?CLIENT mora biti postavljen u .env}_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autokuca}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-autokuca}
      DATA_DIR: /app/data
      OVERRIDES_DIR: /app/overrides
    volumes:
      - ./data:/app/data
      - ./overrides:/app/overrides:ro
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks: [internal, web]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  db:
    image: postgres:16
    container_name: ${CLIENT}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autokuca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-autokuca}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    logging: *logging

networks:
  internal:
    internal: true
  web:
    external: true
    name: web

volumes:
  pgdata:
